name: flutter_recipes_app
description: "Application de recettes multi-écrans avec navigation GoRouter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Navigation avec routes nommées
  go_router: ^14.2.0

  # Gestion d'état simple (thème, liste de recettes, favoris)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
